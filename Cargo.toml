[package]
name = "homepage"
version = "0.1.0"
authors = ["hackartists <hackartists@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }

bdk = { path = "deps/rust-sdk/packages/bdk" }

# Debug
dioxus-logger = "0.5.1"
rand = "0.8.5"
getrandom = { version = "0.2.15", features = ["js"], optional = true }
easy-dynamodb = { version = "0.1.1", optional = true }
slog = { version = "2.7.0", optional = true }

[features]
default = []
server = ["bdk/server", "easy-dynamodb", "slog"]
lambda = ["bdk/lambda", "server"]
web = ["bdk/web", "getrandom"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
